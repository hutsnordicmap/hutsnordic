<style>
:root{--bg:#f7f6f2;--fg:#1d2a24;--mut:#5b6761;--card:#fff;--line:#dcd9cf;--acc:#1f6b4f;--warn:#fff3d6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:1.6rem;line-height:1.2;margin:.2em 0 .5em}
h2{font-size:1.3rem;margin:1.8em 0 .3em;padding-top:.6em;border-top:2px solid var(--line)}
h3{font-size:1.05rem;margin:1.2em 0 .5em}
a{color:var(--acc)}
.n{font-size:.85rem;font-weight:400;color:var(--mut);margin-left:.4em}
.sd{color:var(--mut);margin:.2em 0}
.note{background:var(--warn);border-radius:8px;padding:.6em .8em;margin:.6em 0}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:1em 0 1.5em;padding:0;list-style:none}
.sum a{display:flex;align-items:center;gap:.6em;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:.7em .9em;text-decoration:none;color:var(--fg);font-weight:600}
.sum small{margin-left:auto;font-weight:400;color:var(--mut)}
.k{display:inline-grid;place-items:center;width:1.9em;height:1.9em;border-radius:50%;background:var(--acc);color:var(--card);font-weight:700}
.how{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:8px;padding:.7em 1em;margin:1em 0}
.how q{font-style:italic}
.row{display:flex;flex-wrap:wrap;gap:12px}
figure{margin:0;width:240px;max-width:100%}
.im{display:block;background:#e9e7df;border-radius:6px;overflow:hidden;height:170px}
figure img{width:100%;height:100%;object-fit:contain;display:block}
figcaption{font-size:.85rem;margin-top:.3em;color:var(--mut)}
figcaption b{color:var(--fg);font-size:.95rem}
.also{display:block}
.new{font-size:.75rem;font-weight:600;background:#e4efe9;color:var(--acc);padding:.1em .5em;border-radius:99px;vertical-align:middle}
@media (max-width:520px){figure{width:calc(50% - 6px)} .im{height:130px}}
@media (prefers-color-scheme:dark){:root{--bg:#16201b;--fg:#e8ece9;--mut:#a3b0a9;--card:#1f2c26;--line:#33443b;--acc:#7fd1ad;--warn:#4a3f1c}.im{background:#26352d}.new{background:#26352d}}
.k{flex:none}.k.e{background:var(--mut)}details summary{cursor:pointer;color:var(--acc);font-weight:600;margin:.4em 0 1em}
